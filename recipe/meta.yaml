{% set name = "concurrent-log-handler" %}
{% set version = "0.9.28" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4cc27969b3420239bd153779266f40d9713ece814e312b7aa753ce62c6eacdb8

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    # Add minimum run constraint since in py2 there is an upper bound on portalocker
    - python >={{ python_min }}
    - portalocker >=1.4.0

test:
  imports:
    - concurrent_log_handler
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Preston-Landers/concurrent-log-handler
  summary: RotatingFileHandler replacement with concurrency, gzip and Windows support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mariusvniekerk
